apiVersion: v1
kind: Namespace
metadata:
  name: amrutam
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: amrutam, namespace: amrutam}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: amrutam}
spec:
  replicas: 3
  selector: {matchLabels: {app: api}}
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata: {labels: {app: api}}
    spec:
      serviceAccountName: amrutam
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app: api}}
      containers:
        - name: api
          image: amrutam-api:release
          ports: [{containerPort: 3000}]
          envFrom: [{secretRef: {name: amrutam-runtime}}]
          env:
            - {name: NODE_ENV, value: production}
            - {name: OTEL_SERVICE_NAME, value: amrutam-api}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel.observability.svc:4318"}
            - {name: OTEL_TRACES_SAMPLER, value: parentbased_traceidratio}
            - {name: OTEL_TRACES_SAMPLER_ARG, value: "0.1"}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          startupProbe: {httpGet: {path: /health/live, port: 3000}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /health/ready, port: 3000}, periodSeconds: 5, timeoutSeconds: 4}
          livenessProbe: {httpGet: {path: /health/live, port: 3000}, periodSeconds: 10}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: amrutam}
spec:
  replicas: 2
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      serviceAccountName: amrutam
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: amrutam-api:release
          command: [node, dist/src/worker-main.js]
          envFrom: [{secretRef: {name: amrutam-runtime}}]
          env: [{name: NODE_ENV, value: production}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: amrutam}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 3000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api, namespace: amrutam}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: amrutam}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: api}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: restricted, namespace: amrutam}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
      ports: [{protocol: TCP, port: 3000}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}}]
      ports: [{protocol: TCP, port: 4318}]
    # Replace this CIDR with the actual private DB subnet CIDR before deployment.
    - to: [{ipBlock: {cidr: 10.0.0.0/16}}]
      ports: [{protocol: TCP, port: 5432}]
