receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  attributes/privacy:
    actions:
      - {key: db.statement, action: delete}
      - {key: db.query.text, action: delete}
      - {key: http.url, action: delete}
      - {key: url.full, action: delete}
      - {key: url.query, action: delete}
      - {key: http.target, action: delete}
  batch: {}
exporters:
  otlphttp:
    endpoint: http://tempo:4318
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlphttp]
